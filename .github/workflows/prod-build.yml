name: Prod deploy (on merge to main / manual)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions:  read

jobs:
  build:
    name: Production deps and build
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT:      "${{ secrets.SNOWFLAKE_ACCOUNT }}"
      DBT_USER:               "${{ secrets.DBT_USER }}"
      PRIVATE_KEY_PASSPHRASE: "${{ secrets.PRIVATE_KEY_PASSPHRASE }}"
      PRIVATE_KEY_PATH:       "${{ github.workspace }}/private_key.p8"
      S3_BUCKET:              "${{ secrets.S3_BUCKET }}"
      AWS_ACCESS_KEY_ID:      "${{ secrets.AWS_ACCESS_KEY_ID }}"
      AWS_SECRET_ACCESS_KEY:  "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
    steps:
      - uses: actions/checkout@v4

      - name: Write private key to file
        env:
          PRIVATE_KEY_CONTENT: "${{ secrets.PRIVATE_KEY }}"
        run: echo "$PRIVATE_KEY_CONTENT" | sed 's/\\n/\n/g' > "${{ github.workspace }}/private_key.p8"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - run: uv python install 3.13
      - run: uv sync

      - name: dbt deps
        run: cd healthcare && uv run dbt deps --profiles-dir _prod_profiles --target prod

      - name: dbt snapshot (SCD2)
        run: cd healthcare && uv run dbt snapshot --profiles-dir _prod_profiles --target prod

      - name: dbt build (models + tests)
        run: cd healthcare && uv run dbt build --profiles-dir _prod_profiles --target prod

      - name: Upload prod target as artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-target
          path: healthcare/target/
          retention-days: 90
